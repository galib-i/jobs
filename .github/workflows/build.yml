name: Build

on:
  push:
    branches:
      - main

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: "go.mod"

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@latest

      - name: Install Linux Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev build-essential pkg-config

      - name: Build Wails App
        run: wails3 task build

      - name: Prepare for macOS
        if: runner.os == 'macOS'
        run: |
          cd bin
          zip -r jobs-mac.zip jobs.app

      - name: Prepare for Linux
        if: runner.os == 'Linux'
        run: |
          mv bin/jobs bin/jobs-linux

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: latest
          name: "Latest Automatic Build"
          body: |
            Latest update commit: ${{ github.sha }}
          prerelease: true
          files: |
            bin/jobs.exe
            bin/jobs-linux
            bin/jobs-mac.zip
