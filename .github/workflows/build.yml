name: Build

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  WAILS_VERSION: v3.0.0-alpha.98
jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: "go.mod"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache Go build + Wails CLI
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
            ~/go/bin
          key: ${{ runner.os }}-go-${{ hashFiles('go.sum') }}-${{ env.WAILS_VERSION }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Cache bun install
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install Linux Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-4-dev libwebkitgtk-6.0-dev build-essential pkg-config

      - name: Install Wails
        shell: bash
        run: |
          if ! command -v wails3 &> /dev/null; then
            go install github.com/wailsapp/wails/v3/cmd/wails3@${{ env.WAILS_VERSION }}
          fi

      - name: Build Wails App
        shell: bash
        run: |
          wails3 task build
          if [ "${{ runner.os }}" = "macOS" ]; then
            wails3 task package
          fi

      - name: Prepare for macOS
        if: runner.os == 'macOS'
        run: |
          cd bin
          zip -r jobs-mac.zip jobs.app

      - name: Prepare for Linux
        if: runner.os == 'Linux'
        run: mv bin/jobs bin/jobs-linux

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.os }}
          path: |
            bin/jobs.exe
            bin/jobs-linux
            bin/jobs-mac.zip
          if-no-files-found: ignore
          retention-days: 1

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: bin
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: latest
          name: "Latest Automatic Build"
          body: |
            Latest update commit: ${{ github.sha }}
          prerelease: true
          files: |
            bin/jobs.exe
            bin/jobs-linux
            bin/jobs-mac.zip